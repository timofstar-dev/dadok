<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" fill="none">
  <title>그림책 속 일곱 대륙 세계지도</title>
  <desc>청록색 바다와 초록빛 대륙에 성, 산, 피라미드, 숲, 배와 펭귄이 있는 세계여행 지도.</desc>
  <defs>
    <linearGradient id="sea" x1="160" y1="0" x2="1050" y2="780" gradientUnits="userSpaceOnUse"><stop stop-color="#BDE7E5"/><stop offset="1" stop-color="#DBF0E8"/></linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E3EDB9"/><stop offset="1" stop-color="#C6DEA4"/></linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F4E4AE"/><stop offset="1" stop-color="#DDDAA0"/></linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FCFFF7"/><stop offset="1" stop-color="#DFEEE9"/></linearGradient>
