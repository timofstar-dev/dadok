    <g id="palm"><path d="M0 29Q6 13 2-2" stroke="#AB9568" stroke-width="4" stroke-linecap="round"/><path d="M2-2Q-16-18-21-2Q-9-8 2-2M2-2Q-5-24 8-20Q6-10 2-2M2-2Q22-16 27-2Q14-8 2-2M2-2Q20 0 17 15Q11 4 2-2" fill="#80AB76"/></g>
